<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<style>
  :root {
    --bg: #fbfaf9; --panel: #ffffff; --line: #e4e0db; --ink: #1d1b19;
    --ink-soft: #6b645d; --ink-faint: #9a938b; --accent: #2f6f4e; --accent-soft: #e8f1eb;
    --hearsay: #9a6b2f; --dead: #b4483c; --highlight: #c8a02f;
    --radius: 8px; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151a; --panel: #1e1d24; --line: #32303a; --ink: #eceaf0;
      --ink-soft: #a8a3b2; --ink-faint: #736e7e; --accent: #6fcf9a; --accent-soft: #23342b;
      --hearsay: #d6a45e; --dead: #e2796b; --highlight: #e8c15c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .spacer { flex: 1; }
  button, select, input {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink-faint); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.go { border-color: var(--accent); color: var(--accent); }
  button.danger { border-color: var(--dead); color: var(--dead); }
  input[type=number] { width: 62px; }
  .state { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
  .dot.on { background: var(--accent); }
  .dot.off { background: var(--dead); }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
  section:last-child { border-right: none; }
  .pane-title {
    padding: 9px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 10px;
  }
  .pane-title select { padding: 2px 6px; font-size: 12px; }
  .scroll { overflow-y: auto; padding: 12px 14px; flex: 1; min-height: 0; }

  .agent {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px;
    margin-bottom: 10px; background: var(--panel); cursor: pointer;
  }
  .agent.watched { border-color: var(--accent); background: var(--accent-soft); }
  .agent h2 { margin: 0 0 2px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  .agent .disp { font-size: 12px; color: var(--ink-soft); font-weight: 400; }
  .agent .doing { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .agent .doing b { color: var(--ink); font-weight: 500; }
  .nums { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
  .nums b { color: var(--ink); font-weight: 500; }

  .belief { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .belief:last-child { border-bottom: none; }
  .belief .conf { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-right: 8px; }
  .belief.hearsay .subj { color: var(--hearsay); }
  .belief .subj { color: var(--accent); }
  .belief .pred { color: var(--ink-soft); }

  .ev { font-family: var(--mono); font-size: 12px; padding: 2px 0; color: var(--ink-soft); white-space: pre-wrap; word-break: break-word; }
  .ev .t { color: var(--ink-faint); }
  .ev.act { color: var(--ink); }
  .ev.believe .k { color: var(--accent); }
  .ev.revise .k { color: var(--dead); }
  .ev.act .k { color: var(--highlight); }
  .empty { color: var(--ink-faint); font-style: italic; padding: 8px 0; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Agents</h1>
  <span class="state"><span class="dot" id="dot"></span><span id="stateText">connecting</span></span>
  <span class="spacer"></span>
  <label>how many <input type="number" id="count" min="1" max="8" value="3"></label>
  <select id="policy">
    <option value="reflex">reflex</option>
    <option value="local">local model</option>
    <option value="llm">claude</option>
  </select>
  <button class="go" id="start">start</button>
  <button id="stop">stop</button>
  <button class="danger" id="reset">reset</button>
</header>

<main>
  <section>
    <div class="pane-title">who is out there</div>
    <div class="scroll" id="agents"><div class="empty">nobody yet</div></div>
  </section>
  <section>
    <div class="pane-title">
      <span>what <span id="watchedName">nobody</span> knows and is doing</span>
      <span class="spacer"></span>
      <a id="graphLink" href="#" target="_blank" style="color: var(--accent); font-size: 12px;">full graph</a>
    </div>
    <div class="scroll" id="beliefs"><div class="empty">pick an agent</div></div>
    <div class="pane-title">as it happens</div>
    <div class="scroll" id="events" style="flex: 0 0 40%;"><div class="empty">nothing yet</div></div>
  </section>
</main>

<script>
/* The page holds no truth of its own: status comes from the daemon, and everything about an
   agent's mind is derived from the trace it is writing, read forward from a byte offset. That
   is the same file the replay page reads afterwards, so live and after-the-fact never
   disagree about what happened. */
const state = {
  watching: null,
  offset: 0,
  beliefs: new Map(),   // id -> {triple, confidence, provenance, live}
  labels: new Map(),    // ref -> human name
  events: [],
};

const MOST_EVENTS = 300;

async function json(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}

function setConnected(ok, text) {
  const dot = document.getElementById('dot');
  dot.className = 'dot ' + (ok === null ? '' : ok ? 'on' : 'off');
  document.getElementById('stateText').textContent = text;
}

function label(ref) {
  return state.labels.get(ref) || ref;
}

async function pollStatus() {
  try {
    const status = await json('/api/status');
    setConnected(status.running, status.running
      ? `${status.agents.length} running, policy ${status.policy}`
      : 'idle');
    document.getElementById('start').disabled = status.running;
    document.getElementById('stop').disabled = !status.running;
    renderAgents(status.agents);
    if (!state.watching && status.agents.length) watch(status.agents[0].name);
  } catch (e) {
    setConnected(false, 'daemon unreachable');
  }
}

function renderAgents(agents) {
  const pane = document.getElementById('agents');
  if (!agents.length) {
    pane.innerHTML = '<div class="empty">nobody is out there. press start.</div>';
    return;
  }
  pane.innerHTML = agents.map(a => `
    <div class="agent ${a.name === state.watching ? 'watched' : ''}" data-name="${a.name}">
      <h2>${a.name} <span class="disp">${a.disposition}</span></h2>
      <div class="doing">${a.goal ? `<b>${escapeHtml(a.goal)}</b> &mdash; ${escapeHtml(a.intent || '')}` : 'thinking'}</div>
      <div class="nums">
        <span>map <b>${escapeHtml(a.mapName || a.mapId)}</b></span>
        <span>level <b>${a.level}</b></span>
        ${a.maxHp > 0 ? `<span>hp <b>${a.hp}/${a.maxHp}</b></span>` : ''}
        <span>beliefs <b>${a.liveBeliefs}</b>/${a.beliefs}</span>
        <span>episodes <b>${a.episodes}</b></span>
        <span>tick <b>${a.tick}</b></span>
      </div>
    </div>`).join('');
  pane.querySelectorAll('.agent').forEach(card =>
    card.onclick = () => watch(card.dataset.name));
}

function watch(name) {
  if (state.watching === name) return;
  state.watching = name;
  // -1 means "from here on". Replaying a trace that has been growing for hours to find out
  // what is happening this second is work nobody asked for, and it gets slower every hour.
  state.offset = -1;
  state.beliefs.clear();
  state.labels.clear();
  state.events = [];
  document.getElementById('watchedName').textContent = name;
  document.getElementById('graphLink').href = `/replay.html?trace=/api/trace/${name}`;
  renderBeliefs([]);
  renderEvents();
  pollBeliefs();
}

/* Reads only what is new. The daemon answers with whole lines and the offset to ask from
   next, so a page that falls behind catches up rather than re-reading a growing file. */
async function pollTrace() {
  if (!state.watching) return;
  try {
    const response = await fetch(`/api/trace/${state.watching}?from=${state.offset}`);
    if (!response.ok) return;
    state.offset = Number(response.headers.get('X-Next-Offset') || state.offset);
    const text = await response.text();
    if (!text) return;
    for (const line of text.split('\n')) {
      if (line.trim()) absorb(JSON.parse(line));
    }
    renderEvents();
  } catch (e) { /* a torn poll is not worth a message; the next one will catch up */ }
}

function absorb(event) {
  if (event.kind === 'label') {
    state.labels.set(event.ref, event.text);
    return;
  }
  if (['believe', 'revise', 'act', 'resume'].includes(event.kind)) {
    state.events.push(event);
    if (state.events.length > MOST_EVENTS) state.events.shift();
  }
}

/* Straight from the daemon's own memory rather than rebuilt from the trace, so opening the
   page is instant however long the agent has been alive. */
async function pollBeliefs() {
  if (!state.watching) return;
  try {
    const held = await json(`/api/beliefs/${state.watching}`);
    renderBeliefs(held.beliefs || []);
  } catch (e) { /* the next poll will do */ }
}

function renderBeliefs(beliefs) {
  const pane = document.getElementById('beliefs');
  if (!beliefs.length) {
    pane.innerHTML = '<div class="empty">nothing believed yet</div>';
    return;
  }
  pane.innerHTML = beliefs.map(b => `
    <div class="belief ${b.provenance === 'hearsay' ? 'hearsay' : ''}" title="${b.evidence} episode(s) of evidence">
      <span class="conf">${b.confidence.toFixed(2)}</span>
      <span class="subj">${escapeHtml(b.subject)}</span>
      <span class="pred">${escapeHtml(b.predicate)}</span>
      <span class="subj">${escapeHtml(b.object)}</span>
    </div>`).join('');
}

function renderEvents() {
  const pane = document.getElementById('events');
  if (!state.events.length) {
    pane.innerHTML = '<div class="empty">nothing yet</div>';
    return;
  }
  const atBottom = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 40;
  pane.innerHTML = state.events.slice(-120).map(describe).join('');
  if (atBottom) pane.scrollTop = pane.scrollHeight;
}

function describe(event) {
  const t = `<span class="t">t${event.t}</span> `;
  if (event.kind === 'act') {
    return `<div class="ev act">${t}<span class="k">does</span> ${escapeHtml(event.intent)} ${escapeHtml(JSON.stringify(event.detail || {}))}</div>`;
  }
  if (event.kind === 'believe') {
    const how = event.carried ? 'remembers' : (event.corroborated ? 'confirms' : 'concludes');
    return `<div class="ev believe">${t}<span class="k">${how}</span> ${escapeHtml(event.triple.map(label).join(' '))} <span class="t">${event.confidence}</span></div>`;
  }
  if (event.kind === 'revise') {
    return `<div class="ev revise">${t}<span class="k">stops believing</span> ${escapeHtml(event.triple.map(label).join(' '))}</div>`;
  }
  if (event.kind === 'resume') {
    return `<div class="ev">${t}<span class="k">woke up</span> with ${event.beliefs} beliefs and ${event.episodes} episodes</div>`;
  }
  return '';
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

document.getElementById('start').onclick = async () => {
  const count = document.getElementById('count').value;
  const policy = document.getElementById('policy').value;
  try {
    const result = await json(`/api/start?count=${count}&policy=${policy}`, { method: 'POST' });
    if (!result.started.length) alert(result.note || 'nobody made it into the world');
  } catch (e) {
    alert(e.message);
  }
  pollStatus();
};

document.getElementById('stop').onclick = async () => {
  await fetch('/api/stop', { method: 'POST' });
  pollStatus();
};

document.getElementById('reset').onclick = async () => {
  if (!confirm('Delete the agents’ characters and everything they have learned?')) return;
  try {
    const result = await json('/api/reset', { method: 'POST' });
    alert(`Forgot ${result.mindsForgotten} mind(s), deleted ${result.charactersDeleted} character(s).`
      + (result.note ? `\n${result.note}` : ''));
    state.watching = null;
  } catch (e) {
    alert(e.message);
  }
  pollStatus();
};

pollStatus();
pollTrace();
pollBeliefs();
setInterval(pollStatus, 1500);
setInterval(pollTrace, 1200);
setInterval(pollBeliefs, 2500);
</script>
</body>
</html>
