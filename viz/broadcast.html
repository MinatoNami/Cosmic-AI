<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Live</title>
<style>
  :root {
    --bg: #0d0f14; --tile: #151922; --tile-2: #1b2030; --line: #262c3b;
    --ink: #eef1f7; --ink-soft: #a9b0c2; --ink-faint: #6c7489;
    --hp: #ef5b5b; --mp: #4f8cff; --exp: #f2c14e; --monster: #ff6b6b; --npc: #4fd1c5;
    --drop: #f2c14e; --floor: #3a4256; --rope: #8a7550; --door: #8fa2ff; --water: #0f2a44;
    --stuck: #ffb347; --live: #ff4d4d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { color: var(--ink); font: 15px/1.35 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; display: grid;
    grid-template-rows: 64px 1fr 56px; gap: 0;
  }
  header {
    display: flex; align-items: center; gap: 18px; padding: 0 28px;
    border-bottom: 1px solid var(--line); background: #10131a;
  }
  .live { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .12em; font-size: 13px; }
  .live i { width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 12px var(--live); animation: pulse 1.6s infinite; }
  .live.off i { background: var(--ink-faint); box-shadow: none; animation: none; }
  @keyframes pulse { 50% { opacity: .35; } }
  header h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  header .sub { color: var(--ink-soft); font-size: 14px; }
  header .spacer { flex: 1; }
  header .clock { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 15px; }

  #grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; padding: 14px 18px; }
  .tile {
    position: relative; background: var(--tile); border: 1px solid var(--line); border-radius: 14px;
    display: grid; grid-template-columns: 560px 1fr; overflow: hidden;
    --accent: #5eb1ff;
  }
  .tile .mapwrap { position: relative; border-right: 1px solid var(--line); }
  .tile canvas { display: block; width: 560px; height: 100%; }
  .tile .mapname {
    position: absolute; left: 12px; top: 10px; right: 12px; display: flex; gap: 8px; align-items: center;
    font-size: 13px; color: var(--ink-soft); pointer-events: none;
  }
  .tile .mapname b { color: var(--ink); font-weight: 600; text-shadow: 0 1px 3px #000; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
    background: var(--tile-2); border: 1px solid var(--line); font-size: 12px; color: var(--ink-soft); white-space: nowrap;
  }
  .chip.water { color: #7cc4ff; border-color: #1f4b73; background: #0f2236; }
  .chip.stuck { color: var(--stuck); border-color: #6b4a1c; background: #2a1f10; }
  .chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

  .side { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .who { display: flex; align-items: baseline; gap: 10px; }
  .who .name { font-size: 24px; font-weight: 750; color: var(--accent); letter-spacing: -.01em; }
  .who .job { color: var(--ink-soft); font-size: 15px; }
  .who .lv { margin-left: auto; font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .who .lv small { font-size: 13px; color: var(--ink-faint); font-weight: 600; margin-right: 3px; }
  .bars { display: grid; gap: 4px; }
  .bar { position: relative; height: 15px; border-radius: 5px; background: #0c0f16; overflow: hidden; }
  .bar span { position: absolute; inset: 0 auto 0 0; border-radius: 5px; transition: width .6s ease; }
  .bar em { position: absolute; inset: 0; font: 600 11px/15px Inter, system-ui, sans-serif; font-style: normal; text-align: center; color: #fff; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
  .bar.hp span { background: linear-gradient(90deg, #b83a3a, var(--hp)); }
  .bar.mp span { background: linear-gradient(90deg, #2f5fc4, var(--mp)); }
  .bar.exp span { background: linear-gradient(90deg, #c9952a, var(--exp)); }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; margin-bottom: 2px; }
  .now { font-size: 15.5px; font-weight: 550; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .think {
    background: var(--tile-2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 7px 10px; font-size: 14px; min-height: 64px;
  }
  .think .q { font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .think .then { color: var(--ink-soft); font-size: 13px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .think .age { color: var(--ink-faint); font-size: 11.5px; margin-top: 3px; }
  .recent { font-size: 13px; color: var(--ink-faint); display: grid; gap: 1px; }
  .recent div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bag { display: flex; flex-wrap: wrap; gap: 5px; max-height: 52px; overflow: hidden; }
  .bag .chip b { color: var(--ink); font-weight: 600; }

  .pop {
    position: absolute; left: 280px; top: 46%; transform: translate(-50%, -50%) scale(.6);
    padding: 12px 26px; border-radius: 14px; font-size: 28px; font-weight: 800; letter-spacing: .02em;
    background: color-mix(in srgb, var(--accent) 22%, #0d0f14); border: 2px solid var(--accent);
    color: #fff; text-shadow: 0 2px 6px #000; opacity: 0; pointer-events: none; white-space: nowrap;
    transition: opacity .35s ease, transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  .pop.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .pop small { display: block; font-size: 14px; font-weight: 600; color: var(--ink-soft); text-align: center; letter-spacing: 0; }
  .tile.flash { box-shadow: 0 0 0 2px var(--accent), 0 0 40px color-mix(in srgb, var(--accent) 40%, transparent); }
  .tile.down { opacity: .55; }

  footer {
    border-top: 1px solid var(--line); background: #10131a; display: flex; align-items: center; overflow: hidden;
  }
  footer .tag { flex: none; height: 100%; display: flex; align-items: center; padding: 0 18px; font-weight: 700; font-size: 13px; letter-spacing: .1em; background: #171b26; border-right: 1px solid var(--line); color: var(--ink-soft); }
  #ticker { position: relative; flex: 1; height: 100%; overflow: hidden; }
  #ticker .strip { position: absolute; top: 0; height: 100%; display: flex; align-items: center; gap: 44px; white-space: nowrap; will-change: transform; }
  #ticker .ev { font-size: 16px; color: var(--ink-soft); }
  #ticker .ev b { font-weight: 700; }
  #ticker .ev time { color: var(--ink-faint); font-size: 13px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  #empty { position: absolute; inset: 64px 0 56px; display: none; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 22px; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="live" id="live"><i></i>LIVE</div>
    <h1 id="title">Four AI agents learning to play an MMO</h1>
    <span class="sub">each one decides for itself · a local LLM thinks, reflexes act · they share what they learn</span>
    <span class="spacer"></span>
    <span class="clock" id="clock"></span>
  </header>
  <main id="grid"></main>
  <footer><div class="tag">LATELY</div><div id="ticker"><div class="strip" id="strip"></div></div></footer>
  <div id="empty">Waiting for the agents…</div>
</div>
<script>
'use strict';
const ACCENTS = ['#5eb1ff', '#ff8a5c', '#b48cff', '#5ee0a0', '#ffd166', '#ef6fb0'];
const POLL_MS = 1000;
const STUCK_MINUTES = 10;
const params = new URLSearchParams(location.search);
if (params.get('title')) document.getElementById('title').textContent = params.get('title');

const tiles = new Map();      // name -> {el, canvas, ctx, pos, cam, prev, history, ...}
const geometry = new Map();   // mapId -> geometry | 'loading'
const events = [];            // newest last
let latest = null;

// ---------- layout: fit 1920x1080 into whatever window, 1:1 in OBS ----------
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  const stage = document.getElementById('stage');
  stage.style.transform = `scale(${s})`;
  stage.style.left = `${(innerWidth - 1920 * s) / 2}px`;
  stage.style.top = `${(innerHeight - 1080 * s) / 2}px`;
}
addEventListener('resize', fit); fit();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const num = n => Number(n || 0).toLocaleString('en-US');
const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0;
const clock = () => new Date().toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
function ago(s) { return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`; }

// ---------- data ----------
async function poll() {
  try {
    const r = await fetch('/api/view', {cache: 'no-store'});
    latest = await r.json();
    document.getElementById('live').classList.toggle('off', !latest.running);
    render(latest);
  } catch (e) {
    document.getElementById('live').classList.add('off');
  }
  setTimeout(poll, POLL_MS);
}

function wantGeometry(mapId) {
  if (!mapId || mapId <= 0 || geometry.has(mapId)) return;
  geometry.set(mapId, 'loading');
  fetch(`/api/geometry/${mapId}`).then(r => r.json()).then(g => geometry.set(mapId, g)).catch(() => geometry.delete(mapId));
}

// ---------- tiles ----------
function tileFor(a, index) {
  if (tiles.has(a.name)) return tiles.get(a.name);
  const el = document.createElement('section');
  el.className = 'tile';
  el.style.setProperty('--accent', ACCENTS[index % ACCENTS.length]);
  el.innerHTML = `
    <div class="mapwrap"><canvas width="1120" height="900"></canvas>
      <div class="mapname"><b class="m"></b><span class="tags"></span></div>
      <div class="pop"></div></div>
    <div class="side">
      <div class="who"><span class="name"></span><span class="job"></span><span class="lv"></span></div>
      <div class="bars">
        <div class="bar hp"><span></span><em></em></div>
        <div class="bar mp"><span></span><em></em></div>
        <div class="bar exp"><span></span><em></em></div>
      </div>
      <div class="stats"></div>
      <div><div class="label">Doing now</div><div class="now"></div></div>
      <div><div class="label">Thinking <span class="by"></span></div><div class="think"></div></div>
      <div class="recent"></div>
      <div><div class="label">Bag</div><div class="bag"></div></div>
    </div>`;
  document.getElementById('grid').appendChild(el);
  const canvas = el.querySelector('canvas');
  const t = {el, canvas, ctx: canvas.getContext('2d'), accent: ACCENTS[index % ACCENTS.length],
             pos: null, cam: null, prev: null, history: [], monsters: [], view: null, popTimer: 0};
  tiles.set(a.name, t);
  return t;
}

function render(data) {
  const agents = data.agents || [];
  document.getElementById('empty').style.display = agents.length ? 'none' : 'flex';
  agents.forEach((a, i) => {
    const t = tileFor(a, i);
    wantGeometry(a.mapId);
    noticeEvents(t, a);
    trackExp(t, a);
    t.view = a;
    paintSide(t, a);
  });
  // A grid of four; more than four still fit, two to a row.
  document.getElementById('grid').style.gridTemplateRows = `repeat(${Math.max(1, Math.ceil(agents.length / 2))}, 1fr)`;
  document.getElementById('clock').textContent = clock();
}

function paintSide(t, a) {
  const q = s => t.el.querySelector(s);
  t.el.classList.toggle('down', a.alive === false);
  q('.name').textContent = a.name;
  q('.job').textContent = a.job || '';
  q('.lv').innerHTML = `<small>LV</small>${a.level ?? '?'}`;
  setBar(q('.bar.hp'), a.hp, a.maxHp, `HP ${num(a.hp)} / ${num(a.maxHp)}`);
  setBar(q('.bar.mp'), a.mp, a.maxMp, `MP ${num(a.mp)} / ${num(a.maxMp)}`);
  setBar(q('.bar.exp'), a.exp, a.expNeeded, `EXP ${pct(a.exp, a.expNeeded).toFixed(1)}%`);
  const rate = expPerMinute(t);
  const stats = [`<span class="chip">⚡ ${rate == null ? '–' : num(Math.round(rate))} exp/min</span>`,
                 `<span class="chip">🪙 ${num(a.meso)}</span>`,
                 `<span class="chip accent">${esc(a.disposition || '')}</span>`];
  if ((a.minutesWithoutProgress || 0) >= STUCK_MINUTES) {
    stats.push(`<span class="chip stuck">⚠ no progress for ${a.minutesWithoutProgress} min</span>`);
  }
  q('.stats').innerHTML = stats.join('');
  q('.now').textContent = a.goal || '…';
  const th = a.thought;
  q('.by').textContent = th ? '· local LLM' : '';
  if (th) {
    const then = [th.headingFor && `→ heading for ${th.headingFor}`, th.why && `because ${th.why}`,
                  th.learned && th.learned.length && `learned: ${th.learned.join('; ')}`].filter(Boolean).join(' · ');
    q('.think').innerHTML = `<div class="q">“${esc(th.goal || (th.leaning ? 'lean towards ' + th.leaning : '…'))}”</div>`
      + (then ? `<div class="then">${esc(then)}</div>` : '')
      + `<div class="age">${ago(th.secondsAgo)}${th.leaning ? ' · leaning ' + esc(th.leaning) : ''}</div>`;
  } else {
    q('.think').innerHTML = `<div class="then">Running on reflexes — no model answer yet.</div>`;
  }
  q('.recent').innerHTML = (a.recent || []).slice(0, -1).slice(-3).reverse().map(g => `<div>· ${esc(g)}</div>`).join('');
  q('.bag').innerHTML = (a.inventory || []).slice(0, 8)
    .map(it => `<span class="chip">${esc(it.name)} <b>×${num(it.qty)}</b></span>`).join('') || '<span class="chip">empty</span>';
  q('.m').textContent = a.mapName || (a.mapId > 0 ? `map ${a.mapId}` : 'changing maps…');
  q('.tags').innerHTML = a.swim ? '<span class="chip water">underwater</span>' : '';
}

function setBar(el, value, max, text) {
  el.querySelector('span').style.width = pct(value, max) + '%';
  el.querySelector('em').textContent = text;
}

// ---------- exp per minute, across level-ups ----------
function trackExp(t, a) {
  if (!(a.level > 0)) return;
  const now = Date.now();
  const last = t.history[t.history.length - 1];
  let total = last ? last.total : 0;
  if (last) {
    if (a.level > last.level) total += (last.needed - last.exp) + a.exp;
    else if (a.level === last.level) total += Math.max(0, a.exp - last.exp);
  }
  t.history.push({at: now, level: a.level, exp: a.exp, needed: a.expNeeded, total});
  while (t.history.length && now - t.history[0].at > 5 * 60_000) t.history.shift();
}
function expPerMinute(t) {
  const h = t.history;
  if (h.length < 2 || h[h.length - 1].at - h[0].at < 30_000) return null;
  return (h[h.length - 1].total - h[0].total) / ((h[h.length - 1].at - h[0].at) / 60_000);
}

// ---------- events: level-ups, deaths, new maps, things learned ----------
function noticeEvents(t, a) {
  const p = t.prev;
  if (p) {
    if (a.level > p.level) { pop(t, `LEVEL ${a.level}!`, a.job); addEvent(a, `reached level <b>${a.level}</b>`); }
    if (a.job && p.job && a.job !== p.job) { pop(t, a.job.toUpperCase(), 'job advancement'); addEvent(a, `became a <b>${esc(a.job)}</b>`); }
    if (a.mapId > 0 && p.mapId > 0 && a.mapId !== p.mapId) {
      addEvent(a, `→ ${esc(a.mapName || 'map ' + a.mapId)}`, true);
      if (!t.seenMaps?.has(a.mapId)) pop(t, 'NEW PLACE', a.mapName || '');
    }
    if (a.hp === 0 && p.hp > 0) { pop(t, 'DOWN', a.mapName || ''); addEvent(a, `fell in ${esc(a.mapName || '')}`); }
    const th = a.thought, pth = p.thought;
    if (th && (!pth || th.secondsAgo < pth.secondsAgo) && th.goal) {
      addEvent(a, `thinks: “${esc(th.goal)}”`, true);
    }
  }
  t.seenMaps = t.seenMaps || new Set();
  if (a.mapId > 0) t.seenMaps.add(a.mapId);
  t.heardSeen = t.heardSeen || new Set();
  for (const h of a.heard || []) {
    const key = h.from + '|' + h.text;
    if (t.heardSeen.has(key)) continue;
    t.heardSeen.add(key);
    if (p && h.secondsAgo < 30) addEvent(a, `learned from <b>${esc(h.from)}</b>: ${esc(h.text)}`, true);
  }
  t.prev = a;
}

function addEvent(a, html, quiet) {
  events.push({at: Date.now(), who: a.name, html, quiet});
  while (events.length > 40) events.shift();
  buildStrip();
}

function pop(t, big, small) {
  const el = t.el.querySelector('.pop');
  el.innerHTML = `${esc(big)}${small ? `<small>${esc(small)}</small>` : ''}`;
  el.classList.add('show'); t.el.classList.add('flash');
  clearTimeout(t.popTimer);
  t.popTimer = setTimeout(() => { el.classList.remove('show'); t.el.classList.remove('flash'); }, 6000);
}

// ---------- ticker ----------
let stripX = 0;
function buildStrip() {
  const strip = document.getElementById('strip');
  const shown = events.slice(-18).reverse();
  strip.innerHTML = shown.map(e => {
    const t = tiles.get(e.who);
    return `<span class="ev"><time>${new Date(e.at).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'})}</time>`
      + `<b style="color:${t ? t.accent : 'inherit'}">${esc(e.who)}</b> ${e.html}</span>`;
  }).join('');
}
function scrollStrip(dt) {
  const strip = document.getElementById('strip');
  const box = document.getElementById('ticker').clientWidth;
  if (strip.scrollWidth <= box) { stripX = 0; }
  else { stripX -= dt * 0.06; if (-stripX > strip.scrollWidth) stripX = box; }
  strip.style.transform = `translateX(${stripX}px)`;
}

// ---------- maps ----------
function drawTile(t, dt) {
  const a = t.view, ctx = t.ctx, W = t.canvas.width, H = t.canvas.height;
  ctx.clearRect(0, 0, W, H);
  const g = a && geometry.get(a.mapId);
  ctx.fillStyle = a && a.swim ? '#0c2238' : '#11151e';
  ctx.fillRect(0, 0, W, H);
  if (!a || !g || g === 'loading' || !a.self) return;

  // Smooth the agent and the camera between polls, so movement reads as movement.
  const target = a.self;
  if (!t.pos || t.posMap !== a.mapId) { t.pos = {...target}; t.posMap = a.mapId; t.cam = null; }
  const k = 1 - Math.pow(0.0025, dt / 1000);
  t.pos.x += (target.x - t.pos.x) * k; t.pos.y += (target.y - t.pos.y) * k;

  const [x1, y1, x2, y2] = g.bounds;
  const mw = Math.max(200, x2 - x1), mh = Math.max(200, y2 - y1);
  const fitScale = Math.min(W / (mw + 160), H / (mh + 200));
  const scale = Math.max(Math.min(fitScale, 0.9), 0.32);
  const halfW = W / 2 / scale, halfH = H / 2 / scale;
  let cx = t.pos.x, cy = t.pos.y;
  // Keep the map's edges on screen rather than empty space beyond them.
  cx = mw + 160 <= 2 * halfW ? (x1 + x2) / 2 : Math.max(x1 - 80 + halfW, Math.min(x2 + 80 - halfW, cx));
  cy = mh + 200 <= 2 * halfH ? (y1 + y2) / 2 : Math.max(y1 - 140 + halfH, Math.min(y2 + 60 - halfH, cy));
  if (!t.cam) t.cam = {x: cx, y: cy};
  t.cam.x += (cx - t.cam.x) * k; t.cam.y += (cy - t.cam.y) * k;
  const sx = x => (x - t.cam.x) * scale + W / 2, sy = y => (y - t.cam.y) * scale + H / 2;

  if (a.swim) {   // a little water
    ctx.strokeStyle = 'rgba(124,196,255,0.06)'; ctx.lineWidth = 2;
    for (let i = 0; i < 9; i++) { const yy = (i * 120 + performance.now() / 40) % H; ctx.beginPath(); ctx.moveTo(0, yy); ctx.bezierCurveTo(W / 3, yy - 14, 2 * W / 3, yy + 14, W, yy); ctx.stroke(); }
  }
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#3d4660'; ctx.lineWidth = 5;
  for (const [ax, ay, bx, by] of g.floors) { ctx.beginPath(); ctx.moveTo(sx(ax), sy(ay)); ctx.lineTo(sx(bx), sy(by)); ctx.stroke(); }
  ctx.strokeStyle = '#8a7550'; ctx.lineWidth = 3; ctx.setLineDash([8, 7]);
  for (const [rx, top, bottom] of g.ropes) { ctx.beginPath(); ctx.moveTo(sx(rx), sy(top)); ctx.lineTo(sx(rx), sy(bottom)); ctx.stroke(); }
  ctx.setLineDash([]);
  for (const d of g.doors) {
    const x = sx(d.x), y = sy(d.y);
    ctx.strokeStyle = '#8fa2ff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(x, y - 18, 11, 18, 0, 0, Math.PI * 2); ctx.stroke();
  }
  for (const d of a.drops || []) {
    const x = sx(d.x), y = sy(d.y) - 6;
    ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 6, y); ctx.fill();
  }
  ctx.font = '600 20px Inter, system-ui, sans-serif'; ctx.textAlign = 'center';
  for (const n of a.npcs || []) {
    const x = sx(n.x), y = sy(n.y);
    ctx.fillStyle = '#4fd1c5'; ctx.fillRect(x - 8, y - 26, 16, 26);
    ctx.fillStyle = 'rgba(79,209,197,.9)'; ctx.fillText(n.name || '', x, y - 34);
  }
  for (const m of a.monsters || []) {
    const x = sx(m.x), y = sy(m.y) - 12;
    ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
    if (m.hp != null) {
      ctx.fillStyle = '#000a'; ctx.fillRect(x - 18, y - 24, 36, 6);
      ctx.fillStyle = '#ff6b6b'; ctx.fillRect(x - 18, y - 24, 36 * m.hp / 100, 6);
    }
  }
  // The nearest few monsters get their names; all of them would be a wall of text.
  const near = (a.monsters || []).map(m => ({m, d: Math.hypot(m.x - t.pos.x, m.y - t.pos.y)})).sort((p, q) => p.d - q.d).slice(0, 3);
  ctx.font = '500 18px Inter, system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,170,170,.85)';
  for (const {m} of near) ctx.fillText(m.name || '', sx(m.x), sy(m.y) - 40);

  for (const o of a.others || []) {
    const ot = tiles.get(o.name), x = sx(o.x), y = sy(o.y) - 16;
    ctx.fillStyle = ot ? ot.accent : '#ccc'; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
    ctx.font = '700 20px Inter, system-ui, sans-serif'; ctx.fillText(o.name, x, y - 22);
  }
  // The agent itself.
  const x = sx(t.pos.x), y = sy(t.pos.y) - 18;
  const glow = ctx.createRadialGradient(x, y, 4, x, y, 46);
  glow.addColorStop(0, t.accent + 'aa'); glow.addColorStop(1, t.accent + '00');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 46, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = t.accent; ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  ctx.font = '800 24px Inter, system-ui, sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(a.name, x, y - 28);
}

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(100, now - lastFrame); lastFrame = now;
  for (const t of tiles.values()) drawTile(t, dt);
  scrollStrip(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
poll();
</script>
</body>
</html>
