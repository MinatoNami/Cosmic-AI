services:
  maplestory:
    build: .
    # Named so the agent daemon can run the same build without a second one.
    image: cosmic-ai:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      # Login server
      - "8484:8484"
      # Channels.
      # Format: WWCC, where WW is 75 plus the world number and CC is 75 plus the channel number (both zero indexed).
      # In this case, world 1 channels 1-3.
      - "7575-7577:7575-7577"
    volumes:
      # Config changes can be reloaded without rebuilding the image.
      # Still requires a redeployment as they're sourced on startup.
      - ./config.yaml:/opt/server/config.yaml
      - ./scripts:/opt/server/scripts
      - ./wz:/opt/server/wz
    env_file:
      - ./.env

  # The agents are ordinary clients of the server: same jar, different entrypoint, and they
  # reach it by service name on the compose network. Nothing about the server knows they exist.
  agents:
    image: cosmic-ai:latest
    restart: unless-stopped
    depends_on:
      - maplestory
    entrypoint: ["java", "-cp", "./Server.jar", "-Dwz-path=wz", "agents.Daemon"]
    environment:
      GAME_HOST: maplestory
      GAME_PORT: "8484"
      AGENTS_API_PORT: "8090"
      AGENTS_DATA: /opt/server/agents-data
      AGENTS_UI: /opt/server/viz
      # The local model lives on somebody's laptop, not in this network. Set it in .env.
      LMSTUDIO_URL: "${LMSTUDIO_URL:-}"
    env_file:
      - ./.env
    ports:
      # Control and monitoring. Reachable over tailscale, not published to the world.
      - "8090:8090"
    volumes:
      - ./agents-data:/opt/server/agents-data
      - ./viz:/opt/server/viz

  db:
    image: mysql:8.4.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_ROOT_PASSWORD: "${DB_PASS}"
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
    volumes:
      - ./database/docker-db-data:/var/lib/mysql
